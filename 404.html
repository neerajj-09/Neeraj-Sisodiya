<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page not found · Neeraj Sisodiya</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#06070b">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter Variable", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #06070b;
      color: #eef1f8;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(560px 400px at 76% 22%, rgba(124, 92, 255, 0.16), transparent 70%),
        radial-gradient(500px 380px at 10% 85%, rgba(86, 140, 255, 0.10), transparent 70%);
    }
    main { position: relative; text-align: center; max-width: 480px; }
    .code {
      font-size: clamp(5rem, 18vw, 8rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      background: linear-gradient(100deg, #b7a6ff 0%, #8b6eff 45%, #568cff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    h1 { font-size: 1.4rem; letter-spacing: -0.02em; margin-top: 1rem; }
    p { color: #a7b0c3; margin-top: 0.7rem; font-size: 0.98rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin-top: 2rem;
      padding: 0.78rem 1.5rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      background: linear-gradient(180deg, #8b6eff, #6e4bf5);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 10px 30px -12px rgba(124, 92, 255, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transition: transform 0.2s, filter 0.2s;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.07); }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>This page wandered off.</h1>
    <p>The link may be broken, or the page may have moved.</p>
    <a class="btn" href="/">Back to the portfolio</a>
  </main>
</body>
</html>
